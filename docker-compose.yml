services:

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}

    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

    networks:
      - keycloak-internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KC_DB_USER} -d ${KC_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: keycloak
    restart: unless-stopped

    command:
      - start

    depends_on:
      keycloak-db:
        condition: service_healthy

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${KC_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info

    # IMPORTANT :
    # Keycloak est exposé uniquement sur localhost.
    # Caddy existant pourra accéder à cette adresse.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      
    networks:
      - keycloak-internal
      - proxy

    mem_limit: 2g

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s


volumes:

  keycloak_db_data:


networks:

  # Réseau privé entre Keycloak et PostgreSQL
  keycloak-internal:
    internal: true

  # Réseau Docker déjà utilisé par Caddy
  proxy:
    external: true